<style>
:root{--bg:#0a0d14;--panel:#151b28;--line:#232b3d;--text:#e8edf8;--mute:#8590a8;--red:#ff5473;--blue:#5b9bff;--green:#2ca566;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Inter","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;touch-action:manipulation}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px}
.sc{display:flex;flex-direction:column;min-width:84px}.sc.r{align-items:flex-end}
.sc small{font-weight:700;color:var(--mute);font-size:13px}
.sc b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
#best{color:var(--blue)}
.ib{display:flex;gap:12px}
.ic{width:48px;height:48px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:20px;display:grid;place-items:center;cursor:pointer;padding:0}
#wrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);touch-action:none}
canvas{display:block;background:var(--panel);border-top:1px solid var(--line)}
.ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,13,20,.45)}
.ov.show{display:grid}
.card{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:26px 34px;text-align:center;min-width:70%}
.card h2{margin:0 0 12px;color:var(--red);font-size:34px}
.card .s{color:var(--mute);font-weight:700}
.card .n{font-size:64px;font-weight:800;line-height:1.1}
.go{background:var(--green);border:2px solid #8ff0b4;color:#06150d;font-weight:800;font-size:26px;border-radius:16px;padding:14px 38px;cursor:pointer;margin-top:12px;font-family:inherit}
.sheet{position:fixed;inset:0;display:none;z-index:20}
.sheet.show{display:flex;align-items:flex-end}
.bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:relative;width:100%;max-height:88dvh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ph h3{margin:0;font-size:22px}
.ic.sm{width:40px;height:40px;font-size:16px}
section{padding:14px 0;border-bottom:1px solid var(--line)}
section:last-child{border:0}
section>label{display:block;color:var(--mute);font-weight:700;font-size:13px;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{background:var(--bg);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:14px;font-family:inherit;padding:10px 16px;border-radius:20px;cursor:pointer}
.pills button.on{background:var(--blue);border-color:var(--blue);color:#06101f}
.row{display:flex;align-items:center;gap:12px;margin-top:12px;color:var(--mute);font-weight:700;font-size:14px}
.row input{flex:1;accent-color:var(--blue);height:32px}
.row b{color:var(--text);min-width:28px;text-align:right;font-size:18px}
.row span:first-child{min-width:0}
.cols{display:flex;gap:14px;flex-wrap:wrap}
.cols button{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.cols button.on{border-color:#fff;transform:scale(1.15)}
.tg{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--mute);font-weight:700;font-family:inherit;border-radius:20px;padding:8px 18px;cursor:pointer}
.tg.on{background:var(--green);border-color:var(--green);color:#06150d}
#hud{display:none;justify-content:space-between;align-items:center;padding:0 16px 8px;font-weight:800;font-size:16px}
.pills button:disabled{opacity:.35}
#gear{width:54px;height:54px;background:linear-gradient(135deg,#5b9bff,#3a66d8);border:2px solid #a9c8ff;color:#fff;box-shadow:0 0 16px rgba(91,155,255,.6),inset 0 1px 0 rgba(255,255,255,.35)}
#gear svg{width:32px;height:32px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));transition:transform .4s}
#gear:active svg{transform:rotate(90deg)}
</style>
</head>

<header>
<div class="sc"><small>SCORE</small><b id="score">000</b></div>
<div class="ib"><button class="ic" id="pause">❚❚</button><button class="ic" id="gear"><svg viewBox="0 0 24 24" fill="currentColor"><path stroke="currentColor" stroke-width="1" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button></div>
<div class="sc r"><small>BEST</small><b id="best">000</b></div>
</header>
<div id="hud"></div>
<main id="wrap">
<canvas id="c"></canvas>
<div class="ov" id="ov"><div class="card"><h2 id="ttl">GAME OVER</h2><div class="s">SCORE</div><div class="n" id="fs">000</div><div class="s" id="fb">BEST 000</div><button class="go" id="go">RETRY</button><br><button class="go" id="nx" style="display:none;font-size:20px;padding:10px 26px">পরের স্টেজ ▶</button></div></div>
</main>
<div class="sheet" id="sheet"><div class="bg" id="bgc"></div>

<section><label>গেম মোড</label><div class="pills" id="modes"></div>
<div id="stgrow" style="display:none"><div class="pills" id="stgrid" style="margin-top:12px"></div>
<div class="row"><span>ধীর</span><input type="range" id="spd" min="1" max="5"><span>দ্রুত</span><b id="spdn"></b></div><div class="row" style="margin-top:10px"><span>স্টেজ জিতলে পরেরটা খুলবে। শুরুতে ৪টা জীবন (সর্বোচ্চ ৬)।</span></div></div>
<div class="row" id="lvrow"><span>ধীর</span><input type="range" id="rng" min="1" max="10"><span>দ্রুত</span><b id="lvn"></b></div></section>
<section><label>সাপের রং</label><div class="cols" id="cols"></div></section>
<section><label>সাপের ডিজাইন</label><div class="pills" id="looks"></div></section>

<div class="row"><span>🔊 আওয়াজের মাত্রা</span><input type="range" id="svol" min="0" max="100"><b id="svn"></b></div>
<div class="row"><span>খাওয়ার সাউন্ডের ধরন</span></div>
<div class="pills" id="etype" style="margin-top:8px"></div>
</section>
<section><label>🎵 ব্যাকগ্রাউন্ড মিউজিক</label>

<div class="pills" id="mtype" style="margin-top:12px"></div>
<div class="row"><span>মিউজিকের মাত্রা</span><input type="range" id="mvol" min="0" max="100"><b id="mvn"></b></div></section>
</div></div>
<script>
const C=document.getElementById('c'),x=C.getContext('2d'),$=id=>document.getElementById(id);
const COLS=18;let ROWS=24,cell=10,snake,prev=[],dir,next,food,score,best=0,timer,state='over',ac,alpha=1,tickT=0,curD=200,steps=0,special=null,slow=0,fast=0,gt=0,parts=[],lastF=0,dirty=false,wasPlay=false,hoodT=-9999,W=new Set(),SW=new Set(),SD=[],SM=[],RB=new Set(),BK=new Set(),DS=new Set(),MS=new Set(),lives=4,eaten=0,lost=0,inv=0,foodT=0;
const S={mode:'auto',level:3,skin:150,look:1,mv:.4,mute:false,music:'flute',sv:.7,eat:0,mm:false,stage:1,unlocked:1,stars:{},spd:3};
try{best=+localStorage.getItem('snakeBest')||0;Object.assign(S,JSON.parse(localStorage.getItem('snakeSet')||'{}'))}catch(e){}
const isST=()=>S.mode=='stage',goal=n=>5+Math.ceil(n*.67);
const save=()=>{try{localStorage.setItem('snakeSet',JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(3,'0');
/* ---------- sound ---------- */
function beep(f,t=.08){if(S.mute)return;try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05*S.sv*2;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+t)}catch(e){}}
let sb;
function bus(){if(!sb){sb=ac.createDynamicsCompressor();sb.connect(ac.destination)}return sb}
function tn(ty,f,t,d,v,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.4);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*S.sv*3,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(bus());o.start(t);o.stop(t+d+.05)}
function eatSnd(){if(S.mute)return;try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();const t=ac.currentTime,e=S.eat|0,i=(score/10|0)%6;
if(e==1){tn('square',988,t,.12,.12);tn('square',1319,t+.09,.9,.14);tn('sine',2638,t+.09,.7,.08)}
else if(e==2)[523,659,784,1047].forEach((f,k)=>{tn('triangle',f,t+k*.09,1,.25);tn('sine',f*2,t+k*.09,.6,.08)});
else if(e==3){tn('triangle',400,t,.6,.25,1600);tn('sine',1200,t+.12,1,.2,2400);[2093,2637,3136,3951].forEach((f,k)=>tn('sine',f,t+.25+k*.07,.5,.07))}
else{const f=[659,784,880,988,1175,1319][i];tn('sine',300,t,.3,.3,900);tn('sine',f,t+.06,1,.25);tn('sine',f*2.01,t+.06,.7,.07);tn('sine',f*1.5,t+.22,.9,.12)}
}catch(e){}}
function eatSndOld(){if(S.mute)return;try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();const t=ac.currentTime,f=[659,784,880,988,1175,1319][(score/10|0)%6],o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(900,t+.09);g.gain.setValueAtTime(.3*S.sv*2,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.16);[1,2.01].forEach((m,k)=>{const b=ac.createOscillator(),bg=ac.createGain();b.type='sine';b.frequency.value=f*m;bg.gain.setValueAtTime(0,t+.05);bg.gain.linearRampToValueAtTime((k?.06:.2)*S.sv*2,t+.06);bg.gain.exponentialRampToValueAtTime(.001,t+.4);b.connect(bg);bg.connect(ac.destination);b.start(t+.05);b.stop(t+.45)})}catch(e){}}
function chime(arr,gap=.07){if(S.mute)return;try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();const t0=ac.currentTime;arr.forEach((f,i)=>{[1,2].forEach((m,k)=>{const o=ac.createOscillator(),g=ac.createGain(),t=t0+i*gap;o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime((k?.03:.09)*S.sv*2,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.6)})})}catch(e){}}
let mg,mi,nt=0,ms=0;
const CH=[[262,330,392,523],[220,262,330,440],[175,220,262,349],[196,247,294,392]],BS=[131,110,87,98],PT=[0,1,2,3,2,1,3,2];
function note(f,t,d,v,ty){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
let ph=0,nd=0,NB;
const FS=[523,587,659,784,880,1047],PH=[[2,2],[3,1],[4,1],[3,2],[2,2],[1,2],[0,4],[-1,2],[1,1],[2,1],[3,2],[4,2],[5,2],[4,2],[3,2],[2,2],[1,2],[0,6],[-1,2]],FT=.42;
function fl(f,t,d){const o=ac.createOscillator(),o2=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain(),g2=ac.createGain();o.type='sine';o2.type='triangle';o.frequency.setValueAtTime(f*.96,t);o.frequency.exponentialRampToValueAtTime(f,t+.07);o2.frequency.value=f*2;l.frequency.value=5.2;lg.gain.value=f*.007;l.connect(lg);lg.connect(o.frequency);g2.gain.value=.12;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.09);g.gain.setValueAtTime(.5,t+Math.max(.1,d-.15));g.gain.linearRampToValueAtTime(0,t+d+.12);o.connect(g);o2.connect(g2);g2.connect(g);g.connect(mg);[o,o2,l].forEach(n=>{n.start(t);n.stop(t+d+.2)})}
function flute(on){const[d,l]=PH[ph%PH.length];if(on){if(nt>=nd){note(131,nt,4,.35,'sine');note(196,nt,4,.25,'sine');nd=nt+3.8}if(d>=0)fl(FS[d],nt,l*FT)}ph++;nt+=l*FT}
function tone(ty,f,t,d,v,lp){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);let n=o;if(lp){const bq=ac.createBiquadFilter();bq.type='lowpass';bq.frequency.value=lp;o.connect(bq);n=bq}n.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.35)}
function hat(t){if(!NB){NB=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}const s=ac.createBufferSource(),h=ac.createBiquadFilter(),g=ac.createGain();s.buffer=NB;h.type='highpass';h.frequency.value=7000;g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);s.connect(h);h.connect(g);g.connect(mg);s.start(t);s.stop(t+.08)}
function modern(on){const MS=.27,i=ms&7,b=(ms>>3)%4,CM=[[220,262,330],[175,220,262],[262,330,392],[196,247,294]],BM=[110,87,131,98];if(on){if(i%2==0)kick(nt);else hat(nt);if(i==0||i==3||i==6)tone('sawtooth',BM[b],nt,MS*1.6,.4,420);tone('sawtooth',CM[b][i%3]*2,nt,.22,.16,2200)}ms++;nt+=MS}
function sched(){const on=!S.mm&&S.mv>0&&(state!='pause'||$('sheet').classList.contains('show'));if(S.music=='modern')return modern(on);if(S.music=='soft'){const b=(ms>>3)%4,i=ms&7;if(on){if(i%4==0)note(BS[b],nt,1,.9,'sine');if(i!=5||b%2)note(CH[b][PT[i]]*(i==7?2:1),nt,.5,.5,'triangle')}ms++;nt+=.3;return}flute(on)}
function music(){if(mi)return;try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();mg=ac.createGain();mg.gain.value=S.mv*.3;mg.connect(ac.destination);const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.36;fb.gain.value=.35;wet.gain.value=.4;mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);nt=ac.currentTime+.1;mi=setInterval(()=>{while(nt<ac.currentTime+.4){sched()}},100)}catch(e){}}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,music,{once:true}));
/* ---------- game ---------- */
function delay(){let d=S.mode=='manual'?260-S.level*20:S.mode=='stage'?Math.max(45,(250-S.stage*12)*[1.5,1.25,1,.8,.65][S.spd-1]):Math.max(60,230-(snake.length-4)*7);if(gt<slow)d*=1.7;if(gt<fast)d*=.6;return Math.max(40,d)}
function size(){const w=$('wrap').clientWidth,h=$('wrap').clientHeight,d=devicePixelRatio||1,cs=w/COLS,R=Math.max(10,Math.floor(h/cs));C.style.width=w+'px';C.style.height=R*cs+'px';C.width=w*d;C.height=R*cs*d;cell=C.width/COLS;if(R!=ROWS){ROWS=R;if(snake)start()}draw()}
function spawn(){food=pick(special);foodT=gt+14000}
function spawnSp(){const T=['gold','blue','bolt','shrink'];let type=T[Math.random()*4|0];if(isST()&&lives<6&&Math.random()<(lives<4?.5:.3))type='life';const p=pick(food);special={x:p.x,y:p.y,type,exp:gt+(type=='gold'?6000:type=='life'?10000:9000)};beep(900,.05)}
function eatSp(h){if(!special||h.x!=special.x||h.y!=special.y)return;const t=special.type;
if(t=='gold'){score+=50;chime([784,988,1175,1568,1976])}
else if(t=='blue'){slow=gt+6000;fast=0;score+=10;chime([1319,1047,880,659,523],.09)}
else if(t=='bolt'){fast=gt+6000;slow=0;score+=10;chime([523,659,784,1047,1319,1568],.05)}
else if(t=='life'){lives=Math.min(6,lives+1);score+=10;chime([659,784,988,1319,1568],.07);hud()}
else{for(let k=0;k<3&&snake.length>4;k++)snake.pop();score+=10;chime([880,1175,1480],.08)}
hoodT=performance.now();fw(t,special.x,special.y);special=null;upd()}
function build(st){SW=new Set();SD=[];SM=[];const R_=ROWS,Y=f=>Math.round(f*(R_-1)),m=Y(.5);
const add=(x,y,w=1,h=1)=>{for(let i=0;i<w;i++)for(let j=0;j<h;j++)SW.add((y+j)*COLS+x+i)},
box=(x1,y1,x2,y2,gp=[])=>{for(let a=x1;a<=x2;a++){add(a,y1);add(a,y2)}for(let b=y1;b<=y2;b++){add(x1,b);add(x2,b)}gp.forEach(([gx,gy])=>SW.delete(gy*COLS+gx))},
door=(x,y,w,h,per,ph=0)=>SD.push({x,y,w,h,per,ph}),mv=(x,y,w,h,ax,rg,per)=>SM.push({x,y,w,h,ax,rg,per}),
ser=(ys,dr)=>ys.forEach((y,k)=>{if(k%2==0){add(1,y,14,1);if(dr)door(15,y,2,1,2600,k*1100)}else{add(3,y,14,1);if(dr)door(1,y,2,1,2600,k*1100)}});
if(st==2){add(4,Y(.3),5,1);add(10,Y(.65),5,1)}
else if(st==3)add(3,m,12,1);
else if(st==4){add(5,Y(.25),1,Y(.5));add(12,Y(.25),1,Y(.5))}
else if(st==5){add(4,m,4,1);add(10,m,5,1);add(8,Y(.22),2,Y(.2));add(8,m+3,2,Y(.2))}
else if(st==6)box(4,Y(.35),13,Y(.65),[[8,Y(.65)],[9,Y(.65)]]);
else if(st==7){add(1,Y(.2),13,1);add(4,Y(.4),13,1);add(1,Y(.6),13,1);add(4,Y(.8),13,1)}

/* ---------- settings ---------- */
function pills(el,items,cur,set){items.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.className=cur()==v?'on':'';b.onclick=()=>{set(v);[...el.children].forEach(c=>c.classList.toggle('on',c==b));save()};el.appendChild(b)})}
function sync(){$('lvrow').style.display=S.mode=='manual'?'flex':'none';$('stgrow').style.display=S.mode=='stage'?'block':'none';renderStages();$('spd').value=S.spd;$('spdn').textContent=S.spd;$('lvn').textContent=S.level;$('rng').value=S.level;$('mvol').value=Math.round(S.mv*100);$('svol').value=Math.round(S.sv*100);$('svn').textContent=Math.round(S.sv*100);$('mvn').textContent=Math.round(S.mv*100);$('snd').textContent=S.mute?'বন্ধ':'চালু';$('snd').classList.toggle('on',!S.mute);$('mt').textContent=S.mm?'বন্ধ':'চালু';$('mt').classList.toggle('on',!S.mm)}
pills($('modes'),[['auto','চলমান'],['manual','লেভেল'],['stage','স্টেজ']],()=>S.mode,v=>{if(S.mode!=v){S.mode=v;dirty=true}sync()});
pills($('etype'),[[0,'বুদবুদ'],[1,'কয়েন'],[2,'ঘণ্টা'],[3,'ম্যাজিক']],()=>S.eat,v=>{S.eat=v;eatSnd()});
pills($('mtype'),[['flute','বাঁশি'],['modern','আধুনিক'],['soft','হালকা']],()=>S.music,v=>{S.music=v;ph=0;ms=0;nd=0;music()});
pills($('looks'),[[0,'ক্লাসিক'],[1,'স্মুথ'],[2,'নিয়ন'],[3,'ডোরা'],[4,'দানা'],[5,'ব্লক'],[6,'দাগ'],[7,'কাঁটা']],()=>S.look,v=>S.look=v);
[150,210,28,330,270,52,'rb'].forEach(h=>{const b=document.createElement('button');b.style.background=h=='rb'?'linear-gradient(135deg,#ff5473,#ffc933,#55dd66,#55aaff,#aa55ff)':`hsl(${h},70%,55%)`;if(S.skin==h)b.className='on';b.onclick=()=>{S.skin=h;[...$('cols').children].forEach(c=>c.classList.toggle('on',c==b));save()};$('cols').appendChild(b)});
$('spd').oninput=()=>{S.spd=+$('spd').value;sync();save()};
$('rng').oninput=()=>{S.level=+$('rng').value;sync();save()};
$('mvol').oninput=()=>{S.mv=$('mvol').value/100;if(mg)mg.gain.value=S.mv*.3;sync();music();save()};
$('svol').oninput=()=>{S.sv=$('svol').value/100;sync();save();eatSnd()};
$('mt').onclick=()=>{S.mm=!S.mm;sync();save();music()};
$('snd').onclick=()=>{S.mute=!S.mute;sync();save()};
function openSet(){wasPlay=state=='play';if(wasPlay)tp();$('sheet').classList.add('show')}
function closeSet(){$('sheet').classList.remove('show');if(dirty){dirty=false;start()}else if(wasPlay)tp();wasPlay=false}
$('gear').onclick=openSet;$('cl').onclick=closeSet;$('bgc').onclick=closeSet;
$('nx').onclick=()=>{S.stage=Math.min(15,S.stage+1);save();start()};
$('pause').onclick=tp;$('go').onclick=()=>state=='pause'?tp():start();
addEventListener('resize',size);sync();size();upd();start();requestAnimationFrame(frame);
</script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
